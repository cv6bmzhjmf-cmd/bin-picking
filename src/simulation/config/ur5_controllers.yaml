gazebo_ros2_control:
  ros__parameters:
    pid_gains:
      shoulder_pan_joint:  {p: 100.0, i: 1.0, d: 10.0, i_clamp: 100.0}
      shoulder_lift_joint: {p: 800.0, i: 10.0, d: 50.0, i_clamp: 100.0}
      elbow_joint:          {p: 500.0, i: 10.0, d: 20.0, i_clamp: 100.0}
      wrist_1_joint:        {p: 100.0, i: 1.0, d: 10.0, i_clamp: 100.0}
      wrist_2_joint:        {p: 100.0, i: 1.0, d: 10.0, i_clamp: 100.0}
      wrist_3_joint:        {p: 50.0,  i: 1.0, d: 5.0,  i_clamp: 100.0}

controller_manager:
  ros__parameters:
    update_rate: 50
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

joint_trajectory_controller:
  ros__parameters:
    joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 50.0
    allow_partial_joints_goal: false
    constraints:
      stopped_velocity_tolerance: 0.01
      goal_time: 0.0
